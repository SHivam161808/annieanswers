entries:
  - id: wb-gs4000-202
    kind: fault_code
    manufacturer: worcester_bosch
    ranges:
      - Greenstar 4000
    code: '202'
    meaning: Not a fault. The boiler is in anti-cycle mode, waiting a few minutes before it fires up again.
    homeowner_guidance: null
    engineer_needed: false
    source:
      url: https://www.worcester-bosch.co.uk/support/literature/download/6720891161
      title: Greenstar 4000 Combi Installation Manual (6720891161)
      publisher: Worcester, Bosch Group
      checked: '2026-10-19'
      quote: 202 O Boiler in anti-cycle mode
    status: source_verified
    reviewed_by: null
    limitations:
      From the Greenstar 4000 combi installation manual (2021/10); the system model manual has
      the same table.
  - id: wb-gs4000-224
    kind: fault_code
    manufacturer: worcester_bosch
    ranges:
      - Greenstar 4000
    code: '224'
    meaning: The boiler's overheat safety cut-out has tripped, so it has shut down.
    homeowner_guidance:
      You can try one reset from the boiler's display. If the code comes back, it needs
      a Gas Safe engineer.
    engineer_needed: true
    source:
      url: https://www.worcester-bosch.co.uk/support/literature/download/6720891161
      title: Greenstar 4000 Combi Installation Manual (6720891161)
      publisher: Worcester, Bosch Group
      checked: '2026-10-19'
      quote: 224 B/V Maximal flue gas thermostat or heat exchanger maximal thermostat has activated
    status: source_verified
    reviewed_by: null
    limitations:
      From the Greenstar 4000 combi installation manual (2021/10); the system model manual has
      the same table. Reset step from the range's user instructions.
