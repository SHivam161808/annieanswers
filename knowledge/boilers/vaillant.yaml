  - id: vaillant-ecotec-plus-new-f022
    kind: fault_code
    manufacturer: vaillant
    ranges:
      - ecoTEC plus VU../VUW../VUI..
    code: F.022
    meaning: There is no water or not enough water in the boiler, or the heating water pressure is too low.
    homeowner_guidance: You can top up the heating water with the filling loop as the user guide shows; it recommends at least 1 bar, with 1.5 bar a good value.
    engineer_needed: false
    source:
      url: https://professional.vaillant.co.uk/downloads/aproducts/new-ecotec-plus/0020308119-05-ecotec-plus-combi-storage-combi-and-system-operating-manual-2681224.pdf
      title: ecoTEC plus VU../VUW../VUI.. operating instructions 0020308119_05
      publisher: Vaillant (professional.vaillant.co.uk)
      checked: '2026-10-19'
      quote: No/insufficient water in the product or the water pressure is too low.
    status: source_verified
    reviewed_by: null
    limitations: Three-digit code on this generation; callers may say F22. Where a separate hot water cylinder is fitted, the guide says the installer sets up and explains the filling device.
  - id: vaillant-ecotec-plus-new-f028
    kind: fault_code
    manufacturer: vaillant
    ranges:
      - ecoTEC plus VU../VUW../VUI..
    code: F.028
    meaning: The boiler could not detect a flame while trying to light, and has locked out after five attempts.
    homeowner_guidance: You can press and hold the reset button for more than three seconds to try again, up to three times. If it keeps happening, it needs a Gas Safe engineer.
    engineer_needed: true
    source:
      url: https://professional.vaillant.co.uk/downloads/aproducts/new-ecotec-plus/0020308119-05-ecotec-plus-combi-storage-combi-and-system-operating-manual-2681224.pdf
      title: ecoTEC plus VU../VUW../VUI.. operating instructions 0020308119_05
      publisher: Vaillant (professional.vaillant.co.uk)
      page: PDF p. 21
      checked: '2026-10-19'
      quote: The flame signal was not detected during the ignition phase.
    status: source_verified
    reviewed_by: null
    limitations: Three-digit code on this generation; callers may say F28.
