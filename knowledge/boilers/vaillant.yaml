entries:
  - id: vaillant-ecotec-plus-5-5-f22
    kind: fault_code
    manufacturer: vaillant
    ranges:
      - ecoTEC plus VU, VUW, VUI ..6/5-5
    code: F.22
    meaning: The heating system water pressure is too low.
    homeowner_guidance: You can top the pressure up yourself with the filling loop, as shown in the user guide, to between 1 and 2 bar when the system is cold.
    engineer_needed: false
    source:
      url: https://professional.vaillant.co.uk/downloads/product-manuals/ecotec-plus-1/ecotec-plus-combi-operating-instructions-2913947.pdf
      title: ecoTEC plus VU, VUW, VUI ..6/5-5 operating instructions 0020245033_02
      publisher: Vaillant (professional.vaillant.co.uk)
      page: PDF p. 14
      checked: '2026-10-19'
      quote: 'Low water pressure in the heating installation (fault message: F.22).'
    status: source_verified
    reviewed_by: null
    limitations: "User guide covers filling. Vaillant's fault-code web page adds: if pressure keeps dropping or is above 1 bar with this code, book an engineer. Same operating instructions cover VU, VUW and VUI ..6/5-5."
  - id: vaillant-ecotec-plus-5-5-f28
    kind: fault_code
    manufacturer: vaillant
    ranges:
      - ecoTEC plus VU, VUW, VUI ..6/5-5
    code: F.28
    meaning: The boiler failed to light after repeated ignition attempts and has locked out.
    homeowner_guidance: You can press the reset button to try again; the user guide allows up to three attempts. If it still shows the code, it needs a Gas Safe engineer.
    engineer_needed: true
    source:
      url: https://professional.vaillant.co.uk/downloads/product-manuals/ecotec-plus-1/ecotec-plus-combi-operating-instructions-2913947.pdf
      title: ecoTEC plus VU, VUW, VUI ..6/5-5 operating instructions 0020245033_02
      publisher: Vaillant (professional.vaillant.co.uk)
      page: PDF p. 14
      checked: '2026-10-19'
      quote: 'After three unsuccessful attempts to ignite the flame, the product switches to fault mode (fault message: F.28).'
    status: source_verified
    reviewed_by: null
    limitations: Same operating instructions cover VU, VUW and VUI ..6/5-5.
