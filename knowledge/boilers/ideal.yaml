entries:
  - id: ideal-logic2-f01
    kind: fault_code
    manufacturer: ideal
    ranges: &id001
      - Logic Combi2
      - Logic System2
      - Logic Heat2
      - i-mini2 C
    code: F01
    meaning: Low water pressure in the central heating system.
    homeowner_guidance:
      Check the pressure gauge reads between 1 and 1.5 bar. If it is low, top it up as
      the user guide shows, then restart. If it still fails, call Ideal or a Gas Safe engineer.
    engineer_needed: true
    source:
      url: https://idealheating.com/_gatsby/file/3c34c60c8c9d3f21277198c7ca028e95/Logic%20Combi2%20User%20Guide%20-%2010.2023%20UIN%20237664%20A01.pdf?u=https%3A%2F%2Fassets.ctfassets.net%2Fsj902orc9wh4%2F2NTsKih0WeBUO8G6DrtHtX%2Faec8d34d466e8723d12516aeee4c17cf%2FLogic_Combi2_User_Guide_-_10.2023_UIN_237664_A01.pdf
      title: Logic Combi2 C24 C30 C35 User Guide (10/2023, UIN 237664 A01)
      publisher: Ideal Heating
      page: p. 9, 1.9 Fault Codes
      checked: '2026-10-19'
      quote:
        F 01 | Low Water Pressure | Check system water pressure is between 1 & 1.5bar on the system
        pressure gauge.
    status: source_verified
    reviewed_by: null
    limitations:
      Shown on the display as e.g. 'F 01'; callers may say F1. Same table in the Logic System2
      (UIN 237665), Logic Heat2 (UIN 228298) and i-mini2 C (UIN 252221) user guides. Topping-up steps differ
      by range; follow the boiler's own user guide.
  - id: ideal-logic2-f02
    kind: fault_code
    manufacturer: ideal
    ranges: *id001
    code: F02
    meaning: 'Flame loss: the boiler has lost its flame.'
    homeowner_guidance: null
    engineer_needed: true
    source:
      url: https://idealheating.com/_gatsby/file/3c34c60c8c9d3f21277198c7ca028e95/Logic%20Combi2%20User%20Guide%20-%2010.2023%20UIN%20237664%20A01.pdf?u=https%3A%2F%2Fassets.ctfassets.net%2Fsj902orc9wh4%2F2NTsKih0WeBUO8G6DrtHtX%2Faec8d34d466e8723d12516aeee4c17cf%2FLogic_Combi2_User_Guide_-_10.2023_UIN_237664_A01.pdf
      title: Logic Combi2 C24 C30 C35 User Guide (10/2023, UIN 237664 A01)
      publisher: Ideal Heating
      page: p. 9, 1.9 Fault Codes
      checked: '2026-10-19'
      quote:
        F 02 | Flame Loss | 1. Check other gas appliances in the house are working to confirm a supply
        is present in the property.
    status: source_verified
    reviewed_by: null
    limitations:
      Ideal's own checks for this code involve the gas supply and meter, which the agent must
      not advise on; refer to an engineer. Display shows 'F 02'.
  - id: ideal-logic2-f03
    kind: fault_code
    manufacturer: ideal
    ranges: *id001
    code: F03
    meaning: Fan fault.
    homeowner_guidance:
      Press the restart button once. If the code comes back, the boiler needs Ideal (if
      under warranty) or a Gas Safe engineer.
    engineer_needed: true
