  - id: baxi-c2-e0410-quick-guide
    kind: fault_code
    manufacturer: baxi
    ranges:
      - Baxi 400 Combi 2
      - Baxi 600 Combi 2
      - Baxi 800 Combi 2
      - Baxi Assure 500 Combi 2
      - Baxi 600 System 2
      - Baxi 800 System 2
    code: E.04.10
    meaning: The burner failed to light after four attempts and the boiler has locked out.
    homeowner_guidance: In very cold weather Baxi says the outside condensate pipe may be frozen; thaw it with warm, not boiling, water, then reset the boiler. If it won't reset, call an engineer.
    engineer_needed: false
    source:
      url: https://mediacdn.baxi.co.uk/-/media/websites/baxiuk/files/product-literature/baxi-600-combi-2/baxi-600-combi-2-user-guide.pdf?v=1&d=20230417T093730Z
      title: Quick start guide to your new boiler (Baxi 600 Combi 2)
      publisher: Baxi Heating UK
      page: Troubleshooting
      checked: 2026-10-19
      quote: E.04.10 Frozen condensate pipe Sometimes when it’s very cold, the white plastic condensate pipe outside freezes, and your boiler will shut down to protect itself.
    status: source_verified
    reviewed_by: null
    limitations: Meaning from the 600 Combi 2 installation manual and Baxi's error-code page. The same quick guide (7876395) is linked for the other listed ranges. Outside freezing weather it points to a gas, ignition or flue fault.
