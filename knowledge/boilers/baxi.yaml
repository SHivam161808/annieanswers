entries:
  - id: baxi-c2-a0206
    kind: fault_code
    manufacturer: baxi
    ranges:
      - Baxi 200 Combi 2
      - Baxi 400 Combi 2
      - Baxi 600 Combi 2
      - Baxi 800 Combi 2
      - Baxi Assure 500 Combi 2
      - Baxi 600 System 2
      - Baxi 800 System 2
      - Baxi Assure 500 System 2
    code: A.02.06
    meaning: The heating system water pressure is too low.
    homeowner_guidance: Baxi says you can top the pressure up yourself with the filling link or loop under the boiler, to between 1 and 2 bar. If it keeps dropping, an engineer should check for a leak.
    engineer_needed: false
    source:
      url: https://www.baxi.co.uk/help-and-advice/how-to-guides/how-to-repressurise-your-boiler-with-digital-pressure-gauge
      title: How to repressurise your boiler if you have a digital pressure gauge
      publisher: Baxi Heating UK
      checked: 2026-10-19
      quote: If your boiler is showing the error code A.02.06 or H.02.07, it is indicating that the pressure is too low for the boiler to work and needs topping up.
    status: source_verified
    reviewed_by: null
    limitations: Baxi's page applies this to its 'latest ranges' with a digital pressure gauge. The 1 to 2 bar figure is stated on the same Baxi page and in the 600 Combi 2 manual.
