flags:
  - claim: >-
      Water near electrics (Part 1 §2, Part 3): "If the electricity can be isolated from a dry,
      safe location ... switch off the relevant supply"; "Switch off the electricity only if the
      breaker can be reached from a dry, safe location"; otherwise "leave it to ... emergency
      service".
    concern: >-
      Conflicts with the water_on_electrics script, which tells callers not to touch the fuse box. A
      caller can't judge what is a "dry, safe location" in an emergency. UK wording is consumer unit
      / fuse box / trip switch; 999 is for fire or injury, otherwise an electrician. Not served.
    severity: unsafe
  - claim: >-
      Appliance leak (§6): "If safe, stop using the appliance and shut off its water supply."
    concern: >-
      Means reaching behind a wet, plugged-in machine to its valve and socket. Water-isolation advice
      is not yet approved by the client. Not served; the agent only records what the caller did.
    severity: unsafe
  - claim: >-
      Scenario A/B: "the customer may place a basin underneath if safe"; "advise moving belongings
      only if safe".
    concern: >-
      Sensible in many cases, but standing under a wet or sagging ceiling or near a wet light
      fitting can be dangerous, and these are instructions outside an approved script. Needs client
      approval as an approved script with limits before use.
    severity: unsafe
  - claim: >-
      Burst pipe causes (§3): "Excessive water pressure causing a pipe or connection to fail" listed
      first; freezing is not mentioned.
    concern: >-
      In UK homes, frost is a classic cause of burst pipes in winter and should be among the
      main causes. High mains pressure is a possible factor but not usually the leading one; we
      don't mention pressure to callers.
    severity: unsupported
  - claim: >-
      Use-linked leak (§7): "Poor or inadequate drainage venting affecting wastewater flow" and "an
      overloaded or improperly connected shared drainage pipe" as main causes of a leak.
    concern: >-
      Venting problems usually show as gurgling, smells or traps emptying, not visible leaks; the
      wording reads like US plumbing-code thinking. A partly blocked shared waste backing up is
      plausible and is kept. Shower seals, tray and waste are the usual UK cause and are missing.
    severity: unsupported
  - claim: >-
      US terms in §4 and §5: "kitchen faucet", "toilet tank", "P-trap", "disposer" (waste disposal
      unit), "shut-off valve", "vent arrangement".
    concern: >-
      UK equivalents are tap, cistern, trap or U-bend, waste disposal unit (uncommon in UK homes),
      isolating valve or stopcock, and soil and vent pipe. The agent uses the UK terms.
    severity: incorrect_uk
  - claim: >-
      Under-sink leak (§4): the AI may only explain that there are supply pipes, waste pipes and a
      P-trap under the sink and that a plumber can inspect them.
    concern: >-
