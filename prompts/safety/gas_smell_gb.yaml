when: The caller smells gas, or mentions a gas leak, anywhere in Great Britain.
numbers: [gas_emergency_gb]
text: >-
  Please leave the property now, and don't use any light switches, flames or electrics on the way.
  Once you're outside, ring the National Gas Emergency Service on 0800 111 999.
