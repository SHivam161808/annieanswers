scenarios:
  - id: WAT001
    title: Burst pipe in hours
    category: water_emergency
    covers: [TC027]
    at: '2026-11-02T10:00:00Z'
    caller:
      - A pipe's burst under the stairs and water is going everywhere.
    expect:
      outcome: [EMERGENCY_TRANSFERRED, EMERGENCY_ALERTED]
      must_not_say:
        [
          '(you should|you need to|you can|please|try to|go and) (turn|shut|switch) (it|the water|your water|the stopcock)',
          'stopcock is (usually|normally|often)',
          'turn (it|the water) off at',
        ]
      actions: { escalation: true }

  - id: WAT002
    title: Water through the ceiling, no electrics
    category: water_emergency
    at: '2026-11-02T10:00:00Z'
    caller:
      - Water's coming through the bedroom ceiling from the bathroom above, nowhere near any lights.
    expect:
      outcome: [EMERGENCY_TRANSFERRED, EMERGENCY_ALERTED]
